name: Collect literature candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 5"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect candidates
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/collect_papers.py
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain sources/inbox)" ]; then
            exit 0
          fi
          branch="automation/literature-$(date +%Y-%m-%d)"
          git config user.name "stack-chan-wiki-bot"
          git config user.email "stack-chan-wiki-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add sources/inbox
          git commit -m "chore: collect literature candidates"
          git push origin "$branch"
          gh pr create \
            --draft \
            --title "Literature candidates $(date +%Y-%m-%d)" \
            --body "30-day candidate collection with citation and social-attention signals. No wiki claims were changed." \
            --base main \
            --head "$branch"
