name: Collect literature candidates

on:
  workflow_dispatch:
    inputs:
      publish_pr:
        description: Create a Draft PR containing the collected candidates
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "20 6 * * 5"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify required configuration
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "OPENALEX_API_KEY is required for scheduled collection" >&2
            exit 1
          fi
      - name: Collect candidates
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          API_CONTACT_EMAIL: ${{ secrets.API_CONTACT_EMAIL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/collect_papers.py
      - name: Create pull request
        if: github.event_name == 'schedule' || inputs.publish_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain sources/inbox)" ]; then
            exit 0
          fi
          branch="automation/literature-$(date +%Y-%m-%d)"
          report="sources/inbox/literature-$(date +%Y-%m-%d).md"
          git config user.name "stack-chan-wiki-bot"
          git config user.email "stack-chan-wiki-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add sources/inbox
          git commit -m "chore: collect literature candidates"
          git push origin "$branch"
          gh pr create \
            --draft \
            --title "Literature candidates $(date +%Y-%m-%d)" \
            --body-file "$report" \
            --base main \
            --head "$branch"
