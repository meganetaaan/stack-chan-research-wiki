arxiv:
  enabled: true
  categories:
  - cs.CL
  - cs.HC
  - cs.RO
  - cs.AI
  max_results_per_query: 20
  request_delay_seconds: 3
  queries:
  - theme: dialogue_language
    query: '(all:"social robot" OR all:"human robot interaction") AND (all:dialogue OR all:conversation)'
  - theme: dialogue_language
    query: '(all:"spoken dialogue system" OR all:"full duplex dialogue") AND (all:"turn taking" OR all:backchannel OR all:repair OR all:grounding)'
  - theme: multimodal_interaction
    query: '(all:"embodied agent" OR all:"conversational agent") AND (all:speech OR all:voice OR all:dialogue) AND (all:multimodal OR all:gesture OR all:gaze)'
  - theme: affect_relationships
    query: '(all:"social robot" OR all:"embodied conversational agent") AND (all:personality OR all:emotion OR all:attachment OR all:memory)'
acl_anthology:
  enabled: true
  venues:
  - id: sigdial
    name: SIGDIAL
    theme: dialogue_language
  - id: iwsds
    name: IWSDS
    theme: dialogue_language
  focus_terms:
  - social robot
  - human-robot
  - embodied agent
  - conversational agent
  - spoken dialogue
  - voice-interactive
  - turn-taking
  - backchannel
  - multimodal
  - paralinguistic
  - personality
  - emotion
  - long-term memory
  - full-duplex
  - child
  - older adult
filters:
  languages:
  - en
  - ja
  lookback_days: 30
  max_candidates_per_query: 20
  max_review_candidates: 10
  relevance_reserve: 3
enrichment:
  semantic_scholar: true
  crossref_reddit: true
  x: true
  max_candidates: 20
  request_delay_seconds: 0.2
attention_thresholds:
  min_citations: 1
  min_reddit_mentions: 1
  min_x_original_posts: 3
