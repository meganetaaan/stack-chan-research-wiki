version: 1
domains:
  human-robot-interaction: 人間がロボットをどのように認知し、信頼し、受容し、協働するか
  dialogue-and-language: 音声認識、音声合成、対話管理、ターンテイキング、LLM、言語行動
  multimodal-interaction: 視線、顔、姿勢、動作、音声など複数モダリティの統合
  embodiment-and-expression: 身体性、動き、タイミング、最小自由度による表現
  affect-and-relationships: 感情、人格、共感、愛着、コンパニオンシップ、長期関係
  appearance-and-character-design: かわいい、kawaii、cuteness、顔、目、キャラクター、外観
  cognition-and-agent-architecture: 認知、記憶、計画、ユーザモデル、エージェント構成
  robot-learning-and-adaptation: 学習、適応、パーソナライズ、継続学習
  hardware-and-embedded-intelligence: 組み込みAI、TinyML、音響、制御、低消費電力、センサ
  applications-and-social-deployment: 家庭、教育、福祉、展示、接客、長期導入、離脱
  evaluation-and-research-methods: 実験、フィールド調査、尺度、ログ分析、再現性
  ethics-governance-and-sustainability: 倫理、プライバシー、安全、修理可能性、サービス終了
  open-source-hardware-and-fabrication: オープンソースハードウェア、設計公開、3Dプリント、モジュール化
  maker-culture-and-user-innovation: Maker文化、DIY、改造、ユーザーイノベーション、ファブラボ
  oss-communities-and-commons: OSSコミュニティ、共同生産、ガバナンス、保守、知識共有
  participatory-culture-and-fandom: 推し活、ファンダム、参加型文化、ファン労働、キャラクターへの愛着
